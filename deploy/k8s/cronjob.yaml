# jiraleaks — weekly Jira secret scan (Kubernetes CronJob).
#
# Required Secret (create it out-of-band; never put credentials in this file):
#   kubectl -n security create secret generic jira-credentials \
#     --from-literal=url=https://jira.example.com \
#     --from-literal=pat=<PAT>
#
# Storage: one PVC holds both the reports and the sqlite findings store, mounted
# at /data (no subPath — subPath mounts do not receive fsGroup ownership, which
# would leave them unwritable for UID 65532). Use separate claims if reports and
# store need different retention classes.
#
# Image pinning: `:latest` + `imagePullPolicy: Always` is convenient but makes
# scans non-reproducible. Pin by digest for audited runs —
#   image: registry.example.com/jiraleaks@sha256:<digest>
# — and switch imagePullPolicy to IfNotPresent once tags are immutable.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jiraleaks
  namespace: security
  labels:
    app.kubernetes.io/name: jiraleaks
spec:
  schedule: "0 3 * * 1"           # Every Monday at 03:00 UTC
  timeZone: "UTC"                 # schedule is DST-proof (Kubernetes >= 1.27)
  concurrencyPolicy: Forbid       # two scans must not share the PVC at once
  startingDeadlineSeconds: 600    # skip a run missed by more than 10 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2             # tolerate a transient Jira/network failure
      activeDeadlineSeconds: 3600 # kill a hung scan after one hour
      ttlSecondsAfterFinished: 604800  # keep finished Jobs (logs) for 7 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jiraleaks
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false  # the scan needs no API access
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532            # grants the PVC to the non-root UID
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scanner
              image: registry.example.com/jiraleaks:latest
              imagePullPolicy: Always
              # --state-dir has no environment variable: checkpoint files must be
              # pointed at the volume explicitly.
              args: ["--state-dir", "/data/state"]
              env:
                - name: JIRA_URL
                  valueFrom:
                    secretKeyRef:
                      name: jira-credentials
                      key: url
                - name: JIRA_PAT
                  valueFrom:
                    secretKeyRef:
                      name: jira-credentials
                      key: pat
                - name: JIRA_JQL
                  value: "project = SEC AND updated >= -7d"
                - name: JIRA_NO_PROXY
                  value: "1"
                - name: REPORT_FORMAT
                  value: "all"
                - name: LOG_LEVEL
                  value: "info"
                # The findings store is opened before the first report is
                # written: both targets must be writable or the scan exits 5
                # with no reports produced.
                - name: REPORT_OUTPUT_PATH
                  value: "/data/reports"
                - name: JIRALEAKS_DB_URL
                  value: "sqlite:///data/state/findings.db?mode=rwc"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              volumeMounts:
                - name: data
                  mountPath: /data
                # The root filesystem is read-only and sqlite may spill large
                # sorts into TMPDIR.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jiraleaks-data
            - name: tmp
              emptyDir: {}
